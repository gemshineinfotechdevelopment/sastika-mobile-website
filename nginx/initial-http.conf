# ==============================================================================
# Initial Nginx HTTP Configuration (Use this BEFORE running certbot)
# Domain: sastika-mobiles.gemshine.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sastika-mobiles.gemshine.tech;

    root /var/www/sastika-mobile-website/dist;
    index index.html;

    # API Proxy to Port 5020
    location /api/ {
        proxy_pass http://127.0.0.1:5020/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
