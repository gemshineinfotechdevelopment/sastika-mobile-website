# ==============================================================================
# Nginx Configuration for Sastika Mobiles
# Domain: sastika-mobiles.gemshine.tech
# Backend Service: Node.js (PM2) on http://127.0.0.1:5020
# Frontend Root: /var/www/sastika-mobiles/dist
# ==============================================================================

# Rate Limiting Zone (Protection against brute force / DoS)
limit_req_zone $binary_remote_addr zone=sastika_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# Automatically redirects all HTTP traffic to HTTPS (or handles Let's Encrypt challenge)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sastika-mobiles.gemshine.tech;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443 with SSL)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sastika-mobiles.gemshine.tech;

    # Frontend Static Files
    root /var/www/sastika-mobile-website/dist;
    index index.html;

    # SSL Certificates (Generated via Certbot: certbot --nginx -d sastika-mobiles.gemshine.tech)
    ssl_certificate /etc/letsencrypt/live/sastika-mobiles.gemshine.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sastika-mobiles.gemshine.tech/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # API Backend Reverse Proxy (Node.js Express running on Port 5020)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=sastika_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5020/api/;
        proxy_http_version 1.1;

        # WebSocket & Keep-Alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # Static Assets Caching (Vite hashed bundles, images, icons, fonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Frontend SPA Routing (React Router fallback)
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Logging
    access_log /var/log/nginx/sastika-mobiles.access.log;
    error_log /var/log/nginx/sastika-mobiles.error.log warn;
}
